<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaga</title>
<style>
  :root { --bg:#04040f; --fg:#e8e8ff; --accent:#36f9ff; }
  * { box-sizing:border-box; }
  html,body {
    margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Courier New",monospace; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap { position:relative; }
  canvas { display:block; background:#04040f; border:2px solid #1a1a40; box-shadow:0 0 40px #0a0a30; }
  #hud {
    position:absolute; top:8px; left:0; right:0; padding:0 14px;
    display:flex; justify-content:space-between; font-size:14px;
    letter-spacing:2px; text-transform:uppercase; pointer-events:none;
    text-shadow:0 0 6px var(--accent);
  }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(2,2,12,.78); gap:14px;
  }
  #overlay h1 { margin:0; font-size:44px; letter-spacing:8px; color:var(--accent); text-shadow:0 0 18px var(--accent); }
  #overlay p { margin:2px; font-size:14px; opacity:.85; line-height:1.6; }
  #overlay .big { font-size:18px; color:#ffd54a; }
  .hidden { display:none !important; }
  .blink { animation:blink 1s steps(2,start) infinite; }
  @keyframes blink { to { visibility:hidden; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hud">
    <span>Score <b id="score">0</b></span>
    <span>Hi <b id="hi">0</b></span>
    <span>Wave <b id="wave">1</b></span>
    <span>Ships <b id="lives">3</b></span>
  </div>
  <div id="overlay">
    <h1>GALAGA</h1>
    <p class="big">Move: arrows / A,D / drag &nbsp;·&nbsp; Fire: Space / hold &nbsp;·&nbsp; M: mute</p>
    <p>Clear the formation. Dodge divers and their bombs.</p>
    <p>Bosses fire a tractor beam — if it catches you, you lose a ship.<br>Shoot the captor to free it and fly as a <b style="color:#36f9ff">dual fighter</b>.</p>
    <p class="blink">Press SPACE or tap to start</p>
  </div>
</div>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const $ = id => document.getElementById(id);

const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Space' && state !== 'play') start();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('keydown', e => { if (e.code === 'KeyM') { muted = !muted; } });

// touch / mouse: drag anywhere to steer, hold to fire
let touchFiring = false, touchTargetX = null;
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) * (W / r.width);
}
cv.addEventListener('pointerdown', e => {
  AC();
  if (state !== 'play') { start(); return; }
  touchFiring = true; touchTargetX = pointerPos(e);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (state === 'play' && touchFiring) touchTargetX = pointerPos(e);
});
const endTouch = () => { touchFiring = false; touchTargetX = null; };
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);

let hi = +(localStorage.getItem('galaga_hi') || 0);
$('hi').textContent = hi;

let state = 'menu';   // menu | play | over | clear
let score, lives, wave, player, bullets, ebullets, enemies, stars, particles, popups;
let entryTimer, diveTimer, last, shake = 0, flash = 0, beam = null, captiveDock = null;

function reset() {
  score = 0; lives = 3; wave = 1;
  bullets = []; ebullets = []; particles = []; popups = [];
  shake = 0; flash = 0; beam = null; captiveDock = null;
  makeStars();
  player = { x: W/2, y: H-50, w: 26, h: 22, cd: 0, inv: 0, dual: false, captured: false };
  spawnWave();
}

/* ---------- audio: tiny procedural synth, zero assets ---------- */
let actx, muted = false;
function AC() {
  if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, { type='square', vol=0.05, slideTo=null, delay=0 } = {}) {
  const ac = AC(); if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noise(dur, { vol=0.14 } = {}) {
  const ac = AC(); if (!ac || muted) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(g).connect(ac.destination); src.start();
}
const sfx = {
  shoot:   () => tone(880, 0.09, { type:'square', vol:0.035, slideTo:1500 }),
  hit:     () => tone(320, 0.06, { type:'square', vol:0.05, slideTo:120 }),
  explode: () => { noise(0.25, { vol:0.16 }); tone(200, 0.25, { type:'sawtooth', vol:0.05, slideTo:60 }); },
  dive:    () => tone(140, 0.4, { type:'sawtooth', vol:0.04, slideTo:520 }),
  beam:    () => tone(90, 0.5, { type:'sine', vol:0.06, slideTo:360 }),
  capture: () => { tone(300, 0.5, { type:'sine', vol:0.08, slideTo:1200 }); },
  rescue:  () => { [523,659,784,1047].forEach((f,i)=>tone(f,0.12,{type:'triangle',vol:0.07,delay:i*0.09})); },
  death:   () => { noise(0.5, { vol:0.2 }); tone(400,0.5,{type:'sawtooth',vol:0.07,slideTo:40}); },
  wave:    () => { [523,659,784].forEach((f,i)=>tone(f,0.14,{type:'square',vol:0.05,delay:i*0.1})); },
};

function makeStars() {
  stars = [];
  for (let i=0;i<80;i++) stars.push({ x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.4, v:Math.random()*40+15 });
}

// formation grid: rows x cols
function spawnWave() {
  enemies = [];
  const cols = 8, rows = 4;
  const gx = 56, gy = 70, sx = (W-2*gx)/(cols-1), sy = 42;
  for (let r=0;r<rows;r++) {
    for (let c=0;c<cols;c++) {
      const type = r === 0 ? 'boss' : (r === 1 ? 'red' : 'bee');
      const hx = gx + c*sx, hy = gy + r*sy;
      // entry: come in from a side, swooping
      const fromLeft = r % 2 === 0;
      enemies.push({
        type, homeX: hx, homeY: hy,
        x: fromLeft ? -40 : W+40, y: -40 - c*18,
        w: type==='boss'?28:24, h: 20,
        state: 'enter', t: c*0.12 + r*0.05,
        diveT: 0, path: null, hp: type==='boss'?2:1,
        wob: Math.random()*Math.PI*2,
      });
    }
  }
  entryTimer = 0; diveTimer = 2.2 + Math.random()*2;
  $('wave').textContent = wave;
}

function start() {
  if (state === 'menu' || state === 'over') reset();
  state = 'play';
  $('overlay').classList.add('hidden');
  last = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; localStorage.setItem('galaga_hi', hi); $('hi').textContent = hi; }
  showOverlay('GAME OVER', `Score ${score} · Wave ${wave}`, 'Press SPACE to play again');
}

function showOverlay(title, big, sub) {
  const o = $('overlay');
  o.innerHTML = `<h1>${title}</h1><p class="big">${big}</p><p class="blink">${sub}</p>`;
  o.classList.remove('hidden');
}

function loop(now) {
  if (state !== 'play') return;
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  // stars
  for (const s of stars) { s.y += s.v*dt; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } }

  // player
  const speed = 280;
  if (!player.captured) {
    if (keys.ArrowLeft || keys.KeyA) player.x -= speed*dt;
    if (keys.ArrowRight || keys.KeyD) player.x += speed*dt;
    if (touchTargetX !== null) {
      const d = touchTargetX - player.x;
      player.x += Math.max(-speed*dt, Math.min(speed*dt, d));
    }
  }
  player.x = Math.max(player.w/2, Math.min(W-player.w/2, player.x));
  player.cd -= dt; player.inv -= dt;
  if ((keys.Space || touchFiring) && player.cd <= 0 && !player.captured) {
    if (player.dual) {
      bullets.push({ x: player.x-11, y: player.y-14, v:-560 });
      bullets.push({ x: player.x+11, y: player.y-14, v:-560 });
    } else {
      bullets.push({ x: player.x, y: player.y-14, v:-560 });
    }
    player.cd = 0.28; sfx.shoot();
  }

  // bullets
  for (const b of bullets) b.y += b.v*dt;
  bullets = bullets.filter(b => b.y > -20);
  for (const b of ebullets) { b.y += b.vy*dt; b.x += (b.vx||0)*dt; }
  ebullets = ebullets.filter(b => b.y < H+20 && b.x > -20 && b.x < W+20);

  // enemies
  entryTimer += dt;
  const sway = Math.sin(entryTimer*0.8) * 18;
  let aliveInFormation = 0, allHome = true;

  for (const e of enemies) {
    if (e.state === 'enter') {
      allHome = false;
      e.t -= dt;
      if (e.t <= 0) {
        // ease toward home with a curve
        const tx = e.homeX, ty = e.homeY;
        e.x += (tx - e.x) * Math.min(1, dt*3.2);
        e.y += (ty - e.y) * Math.min(1, dt*3.2);
        if (Math.hypot(tx-e.x, ty-e.y) < 3) { e.state = 'form'; }
      }
    } else if (e.state === 'form') {
      aliveInFormation++;
      e.x = e.homeX + sway;
      e.y = e.homeY;
    } else if (e.state === 'dive') {
      e.diveT += dt;
      // bezier-ish dive: swoop down and across, then loop back to top
      const p = e.path;
      const u = Math.min(1, e.diveT / p.dur);
      const om = 1-u;
      e.x = om*om*p.x0 + 2*om*u*p.cx + u*u*p.x1;
      e.y = om*om*p.y0 + 2*om*u*p.cy + u*u*p.y1;
      // fire occasionally while diving
      e.fire = (e.fire||0) - dt;
      if (e.fire <= 0 && e.y < H-120 && Math.random() < 0.5) {
        const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx,dy)||1;
        ebullets.push({ x:e.x, y:e.y+10, vx: dx/d*120, vy: dy/d*180+60 });
        e.fire = 0.6;
      }
      if (u >= 1) {
        // reappear at top, glide back to home
        e.x = e.homeX; e.y = -30; e.state = 'enter'; e.t = 0;
      }
    } else if (e.state === 'capture') {
      e.capT += dt;
      if (e.capPhase === 'descend') {
        e.x += (e.hoverX - e.x) * Math.min(1, dt*3);
        e.y += (e.hoverY - e.y) * Math.min(1, dt*3);
        if (Math.hypot(e.hoverX-e.x, e.hoverY-e.y) < 6) {
          e.capPhase = 'beam'; e.capT = 0; beam = { e, w:0, x:e.x, top:e.y+14 }; sfx.beam();
        }
      } else if (e.capPhase === 'beam') {
        beam.w = 48 * Math.min(1, e.capT/0.5); beam.x = e.x; beam.top = e.y+14;
        if (e.capT > 0.4 && e.capT < 1.7 && !player.captured && player.inv <= 0 && !player.dual &&
            Math.abs(player.x - e.x) < beam.w/2) {
          doCapture(e);
        } else if (e.capT > 1.9) {
          beam = null; e.capPhase = null; e.state = 'enter'; e.t = 0; e.x = e.homeX; e.y = -30;
        }
      }
    }
    e.wob += dt*8;
  }

  // launch dives from formation
  diveTimer -= dt;
  if (diveTimer <= 0) {
    const candidates = enemies.filter(e => e.state === 'form');
    if (candidates.length) {
      const bosses = candidates.filter(e => e.type === 'boss' && !e.captive);
      // occasionally a boss attempts a tractor-beam capture instead of a dive
      if (!beam && !player.captured && !player.dual && bosses.length && Math.random() < 0.35) {
        startCapture(bosses[(Math.random()*bosses.length)|0]);
      } else {
        const n = Math.min(candidates.length, 1 + Math.floor(wave/2));
        for (let i=0;i<n;i++) {
          const e = candidates[Math.floor(Math.random()*candidates.length)];
          if (e.state !== 'form') continue;
          startDive(e);
        }
      }
    }
    diveTimer = Math.max(0.8, 2.4 - wave*0.15) + Math.random()*1.5;
  }

  // collisions: player bullets vs enemies
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.abs(b.x-e.x) < e.w/2 && Math.abs(b.y-e.y) < e.h/2) {
        b.dead = true; e.hp--; sfx.hit();
        if (e.hp <= 0) {
          e.dead = true;
          let pts = e.type==='boss'?150:(e.type==='red'?80:50);
          if (e.state==='dive' || e.state==='capture') pts *= 2;
          score += pts; addPopup(e.x, e.y, '+'+pts, e.type==='boss'?'#36f9ff':'#ffd54a');
          burst(e.x, e.y, e.type); sfx.explode();
          if (e.captive) freeCaptive(e);
          if (beam && beam.e === e) { beam = null; } // shooting the captor cancels its beam
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  // enemy bullets vs player
  if (player.inv <= 0 && !player.captured) {
    for (const b of ebullets) {
      if (Math.abs(b.x-player.x) < player.w/2 && Math.abs(b.y-player.y) < player.h/2) {
        b.dead = true; hitPlayer(); break;
      }
    }
    // diving enemy vs player
    for (const e of enemies) {
      if (e.state==='dive' && Math.abs(e.x-player.x) < (e.w+player.w)/2-6 && Math.abs(e.y-player.y) < (e.h+player.h)/2-6) {
        e.dead = true; burst(e.x,e.y,e.type); sfx.explode(); hitPlayer(); break;
      }
    }
  }
  ebullets = ebullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  // particles
  for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; p.vy += 60*dt; }
  particles = particles.filter(p => p.life > 0);

  // floating score popups
  for (const p of popups) { p.y -= 26*dt; p.life -= dt*1.4; }
  popups = popups.filter(p => p.life > 0);

  // capture animation: captured ship rises into the captor, then costs a life
  if (player.captured) {
    player.capAnim = Math.min(1, (player.capAnim||0) + dt*1.4);
    if (player.capAnim >= 1) {
      player.captured = false; player.capAnim = 0;
      lives--; $('lives').textContent = lives;
      if (lives <= 0) { gameOver(); return; }
      player.x = W/2; player.inv = 2.2;
    }
  }

  // rescued fighter flies down to dock beside you -> dual fighter
  if (captiveDock) {
    captiveDock.x += (player.x - captiveDock.x) * Math.min(1, dt*4);
    captiveDock.y += (player.y - captiveDock.y) * Math.min(1, dt*4);
    if (!player.captured && Math.hypot(player.x-captiveDock.x, player.y-captiveDock.y) < 8) {
      captiveDock = null; player.dual = true; player.w = 46;
      addPopup(player.x, player.y-24, 'DUAL FIGHTER!', '#36f9ff');
    }
  }

  // decay juice
  shake = Math.max(0, shake - dt*24);
  flash = Math.max(0, flash - dt*2);

  $('score').textContent = score;
  $('lives').textContent = lives;

  // wave clear
  if (enemies.length === 0) {
    wave++;
    sfx.wave();
    spawnWave();
  }
}

function startCapture(e) {
  e.state = 'capture'; e.capT = 0; e.capPhase = 'descend';
  e.hoverX = Math.max(70, Math.min(W-70, player.x));
  e.hoverY = H*0.4;
  sfx.dive();
}

function doCapture(e) {
  player.captured = true; player.capAnim = 0;
  player.capFrom = { x: player.x, y: player.y };
  e.captive = true; beam = null; e.capPhase = null;
  e.state = 'enter'; e.t = 0; e.x = e.homeX; e.y = -30; // fly home carrying the fighter
  sfx.capture(); flash = 0.5; shake = 10;
}

function freeCaptive(e) {
  e.captive = false;
  captiveDock = { x: e.x, y: e.y };
  score += 1000; addPopup(e.x, e.y, '+1000 RESCUE', '#36f9ff');
  sfx.rescue(); flash = 0.35;
}

function addPopup(x, y, txt, col='#fff') { popups.push({ x, y, txt, col, life: 1 }); }

function startDive(e) {
  e.state = 'dive'; e.diveT = 0; e.fire = 0.4; sfx.dive();
  const goLeft = player.x < e.x;
  e.path = {
    x0: e.x, y0: e.y,
    cx: e.x + (goLeft?-160:160), cy: e.y + 220,
    x1: player.x + (Math.random()*160-80), y1: H + 40,
    dur: 1.6 + Math.random()*0.6,
  };
}

function hitPlayer() {
  burst(player.x, player.y, 'player');
  sfx.death(); shake = 14; flash = 0.4;
  if (player.dual) {          // a hit while doubled only costs the second fighter
    player.dual = false; player.w = 26; player.inv = 1.2;
    addPopup(player.x, player.y-24, 'FIGHTER LOST', '#ff7b7b');
    return;
  }
  lives--;
  player.inv = 2.2;
  player.x = W/2;
  if (lives <= 0) gameOver();
}

function burst(x, y, type) {
  shake = Math.max(shake, type==='player'?12:5);
  const col = type==='boss'?'#36f9ff':type==='red'?'#ff5a5a':type==='player'?'#ffd54a':'#ffd54a';
  const n = type==='player'?24:14;
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, sp = Math.random()*180+40;
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:Math.random()*0.6+0.3, col });
  }
}

// ---------- drawing ----------
function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // stars
  ctx.fillStyle = '#9aa0ff';
  for (const s of stars) { ctx.globalAlpha = Math.min(1,s.s/2+0.3); ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  // tractor beam
  if (beam) drawBeam(beam);

  for (const e of enemies) { drawEnemy(e); if (e.captive) drawMiniShip(e.x, e.y-16, 0.85, 0.8); }

  // captured fighter rising into its captor
  if (player.captured) {
    const capt = enemies.find(e => e.captive);
    const tx = capt ? capt.x : W/2, ty = capt ? capt.y-16 : 40, u = player.capAnim||0;
    drawMiniShip(player.capFrom.x + (tx-player.capFrom.x)*u,
                 player.capFrom.y + (ty-player.capFrom.y)*u, 1, 1);
  }

  // player bullets
  ctx.fillStyle = '#fff';
  for (const b of bullets) { ctx.fillRect(b.x-1.5, b.y-10, 3, 12); }
  // enemy bullets
  ctx.fillStyle = '#ff7b7b';
  for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 7); ctx.fill(); }

  // player (blink while invulnerable)
  if (!player.captured && !(player.inv > 0 && Math.floor(player.inv*12)%2)) drawPlayer();
  // rescued fighter in transit
  if (captiveDock) drawMiniShip(captiveDock.x, captiveDock.y, 1, 1);

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life*1.6);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // score popups
  ctx.textAlign = 'center'; ctx.font = 'bold 13px "Courier New",monospace';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'start';

  ctx.restore();

  // white flash overlay (unshaken)
  if (flash > 0.01) { ctx.globalAlpha = Math.min(0.6, flash); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; }
}

function drawBeam(b) {
  const grd = ctx.createLinearGradient(0, b.top, 0, H);
  grd.addColorStop(0, 'rgba(54,249,255,0.55)');
  grd.addColorStop(1, 'rgba(54,249,255,0.02)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(b.x - b.w*0.28, b.top);
  ctx.lineTo(b.x + b.w*0.28, b.top);
  ctx.lineTo(b.x + b.w, H);
  ctx.lineTo(b.x - b.w, H);
  ctx.closePath(); ctx.fill();
}

function shipPath() {
  ctx.beginPath();
  ctx.moveTo(0,-13); ctx.lineTo(4,-2); ctx.lineTo(13,10); ctx.lineTo(4,10);
  ctx.lineTo(4,4); ctx.lineTo(-4,4); ctx.lineTo(-4,10); ctx.lineTo(-13,10);
  ctx.lineTo(-4,-2); ctx.closePath();
}
function oneShip(x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#e8e8ff'; shipPath(); ctx.fill();
  ctx.fillStyle = '#36f9ff'; ctx.fillRect(-2,-6,4,8);
  ctx.restore();
}
function drawPlayer() {
  if (player.dual) { oneShip(player.x-12, player.y); oneShip(player.x+12, player.y); }
  else oneShip(player.x, player.y);
}
function drawMiniShip(x, y, alpha, scale) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
  ctx.fillStyle = '#9aa0ff'; shipPath(); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.state==='dive') ctx.rotate(Math.sin(e.wob*0.5)*0.15);
  const flap = Math.sin(e.wob)*3;
  if (e.type==='boss') {
    ctx.fillStyle = '#36f9ff';
    body(e,'#36f9ff','#1b6e8a', flap);
    ctx.fillStyle = '#fff'; ctx.fillRect(-3,-2,6,4);
  } else if (e.type==='red') {
    body(e,'#ff5a5a','#7a1f1f', flap);
  } else {
    body(e,'#ffd54a','#8a6b00', flap);
  }
  ctx.restore();
}

function body(e, c1, c2, flap) {
  ctx.fillStyle = c2;
  // wings
  ctx.beginPath();
  ctx.moveTo(-12, -2-flap); ctx.lineTo(-5, 2); ctx.lineTo(-12, 8-flap); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(12, -2-flap); ctx.lineTo(5, 2); ctx.lineTo(12, 8-flap); ctx.closePath(); ctx.fill();
  // core
  ctx.fillStyle = c1;
  ctx.beginPath(); ctx.ellipse(0,0,6,8,0,0,7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.fillRect(-3,-3,2,2); ctx.fillRect(1,-3,2,2);
}

// idle backdrop on menu
(function idle(){
  if (state === 'menu') {
    if (!stars) makeStars();
    for (const s of stars) { s.y += s.v*0.016; if (s.y>H){s.y=0;s.x=Math.random()*W;} }
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#9aa0ff';
    for (const s of stars) { ctx.globalAlpha=Math.min(1,s.s/2+0.3); ctx.fillRect(s.x,s.y,s.s,s.s); }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(idle);
})();
</script>
