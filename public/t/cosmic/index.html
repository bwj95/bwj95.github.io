<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Loki's Beach | Cosmic Observation</title>
    <!-- Use Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    
    <!-- Dependencies for Advanced Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head>

<body data-theme="water">
    <!-- Particle System Canvas -->
    <canvas id="particleCanvas" class="bg-canvas"></canvas>

    <!-- Navigation -->
    <nav id="mainNav" class="glass-nav">
        <div class="nav-side nav-side-left">
            <div class="logo">Loki's Beach</div>
        </div>
        <div class="nav-center">
            <h1 class="nav-title">Cosmic Observation</h1>
        </div>
        <div class="nav-side nav-side-right">
            <button id="menuToggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobileMenu" class="mobile-menu hidden">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#" onclick="resetSolarSystem(); return false;">Reset System</a></li>
            <li><a href="#" onclick="resetToOriginalSystem(); return false;">Reset Original System</a></li>
            <li><a href="#" onclick="resetToSunsAndPlanets(); return false;">Suns and Planets Only</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <main style="position: relative;">
        <!-- Home -->
        <section id="home" class="hero fade-in cosmic-home">
            <div class="solar-test-area" aria-label="Large blank area for solar system testing"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; <span id="year"></span> Loki's Beach </p>
    </footer>

    <!-- Floating Notepad -->
    <div id="floatingNotepad" class="floating-notepad glass collapsed">
        <div class="gt-resizer gt-nw" id="gtResizerNW"></div>
        <div class="gt-resizer gt-ne" id="gtResizerNE"></div>
        <div class="gt-resizer gt-sw" id="gtResizerSW"></div>
        <div class="gt-resizer gt-se" id="gtResizerSE"></div>
        <div class="notepad-header">
            <div class="header-group header-mode-slot">
                <button class="notepad-btn mode-toggle" id="particleClickModeBtn" onclick="toggleParticleClickMode()"
                    title="Click mode: gravity pull" aria-label="Click mode: gravity pull" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2">
                        <circle cx="12" cy="12" r="2.5" />
                        <path d="M12 3v4" />
                        <path d="M12 17v4" />
                        <path d="M3 12h4" />
                        <path d="M17 12h4" />
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle disabled" id="impactModeBtn" onclick="toggleImpactEffects()"
                    title="Impact Effects: Disabled" aria-label="Impact Effects: Disabled" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                        <circle cx="12" cy="12" r="3" fill="currentColor" />
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle disabled" id="largeScatterBtn" onclick="toggleLargeScatter()"
                    title="Scatter: Disabled" aria-label="Scatter: Disabled" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2">
                        <circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>
                        <circle cx="12" cy="12" r="2.5" />
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle" id="toggleVfxBtn" onclick="toggleVfx()"
                    title="Toggle Explosion visuals" aria-label="Toggle Explosion visuals" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="m13 2-2 3.5L7 3l1.5 5L3 10l5 1.5L7 17l4.5-1.5L13 19l1.5-4.5L19 16l-3-5 5-2.5-5-2.5 3-5-4.5 1.5L13 2z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle" id="blackHoleModeBtn" onclick="toggleBlackHoleMode()"
                    title="Black Hole Mode" aria-label="Black Hole Mode" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M16 12a4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4 4 4 0 0 1 4 4z" />
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2" />
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle" id="addPlanetModeBtn" onclick="toggleAddPlanetMode()"
                    title="Add Custom Planet" aria-label="Add Custom Planet" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2">
                        <circle cx="9" cy="15" r="5" fill="currentColor"/>
                        <line x1="18" y1="3" x2="18" y2="11" />
                        <line x1="14" y1="7" x2="22" y2="7" />
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle" id="asteroidToggleBtn" onclick="toggleAsteroidMode()"
                    title="Asteroid Placement: Off" aria-label="Asteroid Placement: Off" aria-pressed="false">
                    <span id="asteroidIconSlot">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M12 2L4 7v10l8 5 8-5V7l-8-5z" fill="currentColor" opacity="0.3"/>
                        </svg>
                    </span>
                </button>
                <button class="notepad-btn mode-toggle" id="togglePlanetGravityBtn" onclick="togglePlanetGravity()"
                    title="Planet Gravity Affects Asteroids: Disabled" aria-label="Planet Gravity Affects Asteroids: Disabled" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="5" fill="currentColor" opacity="0.4"/>
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2" />
                        <circle cx="17" cy="17" r="1.5" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div class="header-group">
                <button class="notepad-btn mode-toggle active" id="toggleMainSunAnchorBtn" onclick="toggleMainSunAnchor()"
                    title="Toggle Main Sun Anchor" aria-label="Toggle Main Sun Anchor" aria-pressed="true">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                        <rect x="10" y="10" width="4" height="4" rx="1" fill="currentColor"/>
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle" id="toggleCustomSunsAnchorBtn" onclick="toggleCustomSunsAnchor()"
                    title="Toggle Other Suns Anchor" aria-label="Toggle Other Suns Anchor" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="5" />
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke-dasharray="2 2" />
                        <rect x="11" y="11" width="2" height="2" rx="0.5" fill="currentColor"/>
                    </svg>
                </button>
                <button class="notepad-btn mode-toggle" id="addSunModeBtn" onclick="toggleAddSunMode()"
                    title="Add Custom Sun" aria-label="Add Custom Sun" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="4" fill="currentColor"/>
                        <path d="M12 2v3m0 14v3M4.93 4.93l2.12 2.12m9.9 9.9l2.12 2.12M2 12h3m14 0h3M4.93 19.07l2.12-2.12m9.9-9.9l2.12-2.12" />
                    </svg>
                </button>
                <button class="notepad-btn" id="plusBtn" title="Speed Up Time (+)" onclick="adjustTimeScale(1)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
                <button class="notepad-btn" id="minusBtn" title="Slow Down Time (-)" onclick="adjustTimeScale(-1)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
            </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
