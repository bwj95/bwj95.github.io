<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoulderPhys | Intelligence Rehab Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="water">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
                </div>
                <div class="brand-name">ShoulderPhys</div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-link active" id="nav-dashboard" onclick="showView('dashboard')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-link" id="nav-library" onclick="showView('library')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    <span>Library</span>
                </a>
            </nav>

            <div class="sidebar-footer" style="margin-top:auto">
                <p style="font-size:0.7rem; color:var(--text-dim); text-align:center">Nexus Rehab Dashboard v2.0</p>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <main class="workspace">
            <header class="topbar">
                <button class="icon-btn menu-btn" onclick="toggleSidebar()" style="margin-right: 0.5rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="search-container">
                    <div class="search-shell">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="text" id="globalSearch" placeholder="Search Library to add..." autocomplete="off">
                    </div>
                    <div id="searchResults" class="search-results-overlay glass hidden"></div>
                </div>
                <div class="topbar-actions">
                    <button class="icon-btn" id="copyDayBtn" onclick="copyDay(event)" title="Copy Day" style="gap: 0.5rem; display: flex; align-items: center; padding: 0.5rem 1rem; width: auto;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        <span style="font-size: 0.85rem; font-weight: 600;">Copy Day</span>
                    </button>
                    <div class="topbar-date glass" id="topbarDate" style="padding: 0.5rem 1rem; border-radius: 10px; font-weight: 700;">
                        <!-- Date will be rendered here -->
                    </div>
                </div>
            </header>

            <div class="content-scroll">
                <div id="view-dashboard" class="content-view">
                    <div class="calendar-wrapper">
                        <div class="mini-calendar glass" id="mainCal">
                            <div class="cal-header">
                                <button onclick="changeMonth(-1)">&lt;</button>
                                <span id="calMonthYear"></span>
                                <button onclick="changeMonth(1)">&gt;</button>
                            </div>
                            <div class="cal-days" id="calDays">
                                <!-- Calendar generated by JS -->
                            </div>
                        </div>
                    </div>
                    <div class="routine-grid">
                        <section class="day-section">
                            <div class="exercise-cards" id="scheduledExercises">
                                <!-- Exercises generated by JS -->
                            </div>
                        </section>
                    </div>
                </div>

                <div id="view-library" class="content-view hidden">
                    <div class="library-header">
                        <h2>Exercise Library</h2>
                        <div class="view-switcher glass">
                            <button id="btn-view-sections" class="active" onclick="switchLibraryView('sections')">Sections</button>
                            <button id="btn-view-alpha" onclick="switchLibraryView('alpha')">A-Z</button>
                        </div>
                    </div>
                    <div id="library-sections" class="library-content">
                        <!-- Sections generated by JS -->
                    </div>
                    <div id="library-alpha" class="library-content hidden">
                        <div class="library-list alpha"></div>
                    </div>
                </div>
            </div>

            <!-- Floating Action Bar -->
            <div id="batchBar" class="batch-bar glass">
                <div class="batch-info">
                    <div class="batch-count" id="selectedCount">Copied Exercises</div>
                    <div class="batch-status" id="batchStatus">Paste Mode Active. Click a date on the calendar above.</div>
                </div>
                <div class="batch-actions" id="pasteActions" style="display:none;">
                    <button class="batch-btn cancel" onclick="cancelPaste()">Cancel Paste</button>
                </div>
                <div class="batch-actions" id="groupActions" style="display:none; gap: 0.5rem;">
                    <button class="batch-btn copy" onclick="copyGroup()" style="background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: white;">Copy</button>
                    <button class="batch-btn delete" onclick="deleteGroup()" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);">Delete</button>
                    <button class="batch-btn cancel" onclick="cancelGroup()">Cancel</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Notepad -->
    <div id="floatingNotepad" class="floating-notepad glass collapsed">
        <div class="gt-resizer" id="gtResizer"></div>
        <div class="notepad-header">
            <div class="header-group">
                <div class="theme-switcher">
                    <button class="theme-btn water" onclick="setTheme('water')" title="Water"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></button>
                    <button class="theme-btn fire" onclick="setTheme('fire')" title="Fire"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></button>
                    <button class="theme-btn leaf" onclick="setTheme('leaf')" title="Leaf"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 9.2A7 7 0 0 1 11 20z"></path><path d="M7 20l4-7"></path></svg></button>
                    <button class="theme-btn minion" onclick="setTheme('minion')" title="Lightning"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></button>
                </div>
            </div>
            <div class="header-group">
                <button class="notepad-btn save" onclick="saveNotepad()" title="Save Note">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
                </button>
                <button class="notepad-btn clear" onclick="clearNotepad()" title="Clear">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><line x1="10" y1="11" x2="14" y2="15"/><line x1="14" y1="11" x2="10" y2="15"/></svg>
                </button>
                <button class="notepad-btn hide" onclick="toggleNotepad()" title="Toggle">
                    <svg id="gtChevron" style="transform: rotate(180deg);" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
                </button>
            </div>
        </div>
        <div class="notepad-body">
            <textarea id="notepadContent" placeholder="Workout session notes..."></textarea>
        </div>
        <div class="notepad-footer">
            <span id="saveStatus" style="font-size: 0.7rem; color: var(--text-dim);"></span>
        </div>
    </div>

    <!-- Quick Add Modal -->
    <div class="modal-overlay" id="quickAddModal">
        <div class="modal-content">
            <h2 id="modalTitle">Schedule Exercise</h2>
            <p id="modalSubcat" style="font-size: 0.8rem; color: var(--accent); margin-bottom: 1.5rem;"></p>
            <input type="hidden" id="addExName">
            <input type="hidden" id="addExCat">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group"><label>Sets</label><input type="number" id="addSets" class="input-field" value="3"></div>
                <div class="form-group"><label>Reps/Time</label><input type="text" id="addReps" class="input-field" value="10 reps"></div>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button class="primary-btn" onclick="confirmAddExercise()" style="flex: 1;">Schedule for Today</button>
                <button class="batch-btn cancel" onclick="closeModals()" style="height: auto; padding: 0.8rem 1rem;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
