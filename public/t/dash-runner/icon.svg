    <rect x="-26" y="-150" width="52" height="52" rx="14" fill="#ffce9e"/>
    <rect x="-30" y="-160" width="60" height="20" rx="8" fill="#2a1c14"/>
    <rect x="-30" y="-34" width="24" height="58" rx="10" fill="#2a3b8f"/>
    <rect x="8" y="-34" width="24" height="58" rx="10" fill="#2a3b8f"/>
    <rect x="-58" y="-86" width="22" height="50" rx="10" fill="#36d1ff" transform="rotate(18 -47 -61)"/>
    <rect x="36" y="-86" width="22" height="50" rx="10" fill="#36d1ff" transform="rotate(-18 47 -61)"/>
