       uses (deep green -> vivid green -> white-hot heart). No name, just the flame. -->
  <defs>
    <linearGradient id="body" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6bef8c"/><stop offset="0.5" stop-color="#56ec78"/><stop offset="1" stop-color="#0f6b2b"/>
    </linearGradient>
    <radialGradient id="heart" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#f2fff0"/><stop offset="0.5" stop-color="#c6ffd2" stop-opacity="0.9"/><stop offset="1" stop-color="#56ec78" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#050505"/>
  <path d="M53 5 C57 20, 66 28, 69 39 C71 47, 70 54, 70 61 C70 78, 61 92, 50 92 C39 92, 30 78, 30 61 C30 51, 35 42, 42 35 C41 43, 43 48, 46 49 C41 38, 45 17, 53 5 Z" fill="url(#body)"/>
